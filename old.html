<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circle Chain Game</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      canvas {
        background: #222;
        display: block;
        border: 2px solid #333;
      }
      #instructions {
        position: absolute;
        top: 10px;
        color: white;
        font-family: Arial, sans-serif;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="instructions">
      WASD or Arrow Keys to move | Mouse to aim | Click to fire chain weapon
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
      // Canvas setup
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = 800;
      canvas.height = 600;

      // Game variables
      const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 20,
        color: "#3498db",
        speed: 5, // Slightly increased player speed
        direction: { x: 0, y: 0 },
      };

      const enemies = [];
      const enemyCount = 15;

      let mouseX = 0;
      let mouseY = 0;

      // Chain weapon class with direct control
      class ChainWeapon {
        constructor(startX, startY, linkCount = 10) {
          this.links = [];
          this.linkCount = linkCount;
          this.baseRadius = 6; // Base radius for first links
          this.linkDistance = 12;

          // States: "IDLE", "EXTENDING", "EXTENDED", "RETRACTING"
          this.state = "IDLE";
          this.angle = 0;
          this.maxLength = this.linkDistance * linkCount;
          this.currentLength = 0;
          this.extendSpeed = 30; // Doubled extension speed
          this.retractSpeed = 25; // Increased retraction speed
          this.holdTime = 5; // Reduced hold time for faster action
          this.holdCounter = 0;

          // Triangle tip properties - increased size
          this.triangleTip = {
            size: 20, // Increased from 15 to 20
          };

          // Initialize links with gradually increasing sizes towards the end
          for (let i = 0; i < linkCount; i++) {
            // Calculate radius with progressive increase for links near the end
            const progressFactor = i / (linkCount - 1); // 0 for first link, 1 for last link
            const radiusIncrease = progressFactor * progressFactor * 8; // Quadratic increase
            const radius = this.baseRadius + radiusIncrease;

            this.links.push({
              x: startX,
              y: startY,
              radius: radius,
            });
          }

          // Make sure the tip is positioned outside the last circle (which is now bigger)
          const lastLinkRadius = this.links[linkCount - 1].radius;
          this.tipOffset = lastLinkRadius + this.triangleTip.size / 2 + 2;

          // Track hit enemies to prevent multiple hits on the same enemy
          this.hitEnemies = new Set();
        }

        fire(startX, startY, angle) {
          if (this.state !== "IDLE") return;

          this.state = "EXTENDING";
          this.angle = angle;
          this.currentLength = 0;
          this.originX = startX;
          this.originY = startY;

          // Clear hit enemies when firing a new shot
          this.hitEnemies.clear();
        }

        update(playerX, playerY) {
          // Always update origin to follow player
          this.originX = playerX;
          this.originY = playerY;

          switch (this.state) {
            case "IDLE":
              // Nothing to do when idle
              break;

            case "EXTENDING":
              // Increase chain length during extension
              this.currentLength += this.extendSpeed;

              // Check if we've reached maximum length
              if (this.currentLength >= this.maxLength) {
                this.currentLength = this.maxLength;
                this.state = "EXTENDED";
                this.holdCounter = this.holdTime;
              }
              break;

            case "EXTENDED":
              // Hold at full extension for a moment
              this.holdCounter--;
              if (this.holdCounter <= 0) {
                this.state = "RETRACTING";
              }
              break;

            case "RETRACTING":
              // Decrease chain length during retraction
              this.currentLength -= this.retractSpeed;

              // Check if fully retracted
              if (this.currentLength <= 0) {
                this.currentLength = 0;
                this.state = "IDLE";
                // Clear hit enemies when fully retracted
                this.hitEnemies.clear();
              }
              break;
          }

          // Calculate positions of all chain links based on current length
          if (this.state !== "IDLE") {
            // Calculate number of links that should be visible
            const visibleLinks = Math.min(
              Math.ceil(this.currentLength / this.linkDistance),
              this.linkCount
            );

            for (let i = 0; i < this.linkCount; i++) {
              if (i < visibleLinks) {
                // For visible links, calculate exact positions
                const linkDistance = (i + 1) * this.linkDistance;
                const linkLength = Math.min(linkDistance, this.currentLength);

                this.links[i].x =
                  this.originX + Math.cos(this.angle) * linkLength;
                this.links[i].y =
                  this.originY + Math.sin(this.angle) * linkLength;
              } else {
                // For invisible links (beyond current length), hide them at origin
                this.links[i].x = this.originX;
                this.links[i].y = this.originY;
              }
            }

            // Update triangle tip position
            if (visibleLinks > 0) {
              const lastLink = this.links[visibleLinks - 1];
              // Position triangle tip with enough space to avoid overlap
              this.triangleTip.x =
                lastLink.x + Math.cos(this.angle) * this.tipOffset;
              this.triangleTip.y =
                lastLink.y + Math.sin(this.angle) * this.tipOffset;
            } else {
              // If no links are visible, place at origin
              this.triangleTip.x = this.originX;
              this.triangleTip.y = this.originY;
            }
          }
        }

        render(ctx) {
          if (this.state === "IDLE") return;

          // Calculate which links are visible based on current length
          const visibleLinks = Math.min(
            Math.ceil(this.currentLength / this.linkDistance),
            this.linkCount
          );

          // Draw only the visible chain links
          for (let i = 0; i < visibleLinks; i++) {
            const link = this.links[i];
            ctx.beginPath();
            ctx.arc(link.x, link.y, link.radius, 0, Math.PI * 2);
            ctx.fillStyle = i === 0 ? "#5499db" : "#888"; // First link slightly different color
            ctx.fill();
            ctx.closePath();
          }

          // Draw triangle tip only if we have at least one visible link
          if (visibleLinks > 0) {
            ctx.save();
            ctx.translate(this.triangleTip.x, this.triangleTip.y);
            ctx.rotate(this.angle);

            // Draw triangle pointing along the angle
            ctx.beginPath();
            ctx.moveTo(this.triangleTip.size / 2, 0);
            ctx.lineTo(-this.triangleTip.size / 2, -this.triangleTip.size / 2);
            ctx.lineTo(-this.triangleTip.size / 2, this.triangleTip.size / 2);
            ctx.fillStyle = "#e74c3c";
            ctx.fill();
            ctx.closePath();

            ctx.restore();
          }
        }

        checkCollisions(enemies) {
          if (this.state !== "EXTENDING" && this.state !== "EXTENDED")
            return [];

          const hitEnemyIndices = [];

          // Check triangle tip for collisions
          for (let i = 0; i < enemies.length; i++) {
            // Skip enemies we've already hit
            if (this.hitEnemies.has(i)) continue;

            const enemy = enemies[i];

            const dx = this.triangleTip.x - enemy.x;
            const dy = this.triangleTip.y - enemy.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < this.triangleTip.size / 2 + enemy.radius) {
              hitEnemyIndices.push(i);
              this.hitEnemies.add(i); // Mark this enemy as hit
            }
          }

          // Also check the last few links
          const visibleLinks = Math.min(
            Math.ceil(this.currentLength / this.linkDistance),
            this.linkCount
          );

          let startCheckIndex = Math.max(0, visibleLinks - 3);
          for (let j = startCheckIndex; j < visibleLinks; j++) {
            if (j >= this.links.length) break;

            const link = this.links[j];

            for (let i = 0; i < enemies.length; i++) {
              // Skip enemies we've already hit
              if (this.hitEnemies.has(i)) continue;

              const enemy = enemies[i];

              const dx = link.x - enemy.x;
              const dy = link.y - enemy.y;
              const distance = Math.sqrt(dx * dx + dy * dy);

              if (distance < link.radius + enemy.radius) {
                hitEnemyIndices.push(i);
                this.hitEnemies.add(i); // Mark this enemy as hit
              }
            }
          }

          return hitEnemyIndices;
        }

        forceRetract() {
          if (this.state === "EXTENDING" || this.state === "EXTENDED") {
            this.state = "RETRACTING";
            // Ensure retracting state doesn't get interrupted
            this.holdCounter = 0;
          }
          // Don't do anything if already retracting
        }
      }

      // Initialize chain weapon
      const chainWeapon = new ChainWeapon(player.x, player.y, 15);

      // Effects system for visual feedback
      class EffectsSystem {
        constructor() {
          this.particles = [];
        }

        createHitEffect(x, y, color) {
          for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3;

            this.particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              color: color || "#e74c3c",
              size: 3 + Math.random() * 5,
              life: 20 + Math.random() * 10,
            });
          }
        }

        update() {
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];

            p.x += p.vx;
            p.y += p.vy;
            p.life--;

            if (p.life <= 0) {
              this.particles.splice(i, 1);
            }
          }
        }

        render(ctx) {
          for (const p of this.particles) {
            ctx.globalAlpha = p.life / 30;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.closePath();
          }
          ctx.globalAlpha = 1;
        }
      }

      const effects = new EffectsSystem();

      // Generate random enemies
      function generateEnemies() {
        for (let i = 0; i < enemyCount; i++) {
          let x, y, validPosition;

          // Make sure enemies don't spawn too close to player
          do {
            validPosition = true;
            x = Math.random() * (canvas.width - 60) + 30;
            y = Math.random() * (canvas.height - 60) + 30;

            const dx = x - player.x;
            const dy = y - player.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 150) {
              validPosition = false;
            }
          } while (!validPosition);

          const radius = Math.random() * 10 + 15;
          enemies.push({
            x: x,
            y: y,
            radius: radius,
            color: `hsl(${Math.random() * 60 + 340}, 80%, 60%)`,
          });
        }
      }

      // Input handling
      const keys = {};
      let lastClickTime = 0;
      const clickCooldown = 200; // ms between accepted clicks

      window.addEventListener("keydown", (e) => {
        keys[e.key] = true;
      });

      window.addEventListener("keyup", (e) => {
        keys[e.key] = false;
      });

      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
      });

      canvas.addEventListener("mousedown", (e) => {
        // Prevent rapid clicking from interfering with chain behavior
        const now = Date.now();
        if (now - lastClickTime < clickCooldown) return;
        lastClickTime = now;

        const angle = Math.atan2(mouseY - player.y, mouseX - player.x);

        if (chainWeapon.state === "IDLE") {
          chainWeapon.fire(player.x, player.y, angle);
        } else if (
          chainWeapon.state === "EXTENDING" ||
          chainWeapon.state === "EXTENDED"
        ) {
          chainWeapon.forceRetract();
        }
        // Nothing happens if already retracting - can't interrupt retraction
      });

      // Generate new enemy
      function spawnNewEnemy() {
        let x, y, validPosition;
        do {
          validPosition = true;
          x = Math.random() * (canvas.width - 60) + 30;
          y = Math.random() * (canvas.height - 60) + 30;

          const dx = x - player.x;
          const dy = y - player.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 150) {
            validPosition = false;
          }
        } while (!validPosition);

        const radius = Math.random() * 10 + 15;
        enemies.push({
          x: x,
          y: y,
          radius: radius,
          color: `hsl(${Math.random() * 60 + 340}, 80%, 60%)`,
        });
      }

      // Game update function
      function update() {
        // Update player direction based on key input
        player.direction.x = 0;
        player.direction.y = 0;

        if (keys["ArrowUp"] || keys["w"] || keys["W"]) player.direction.y = -1;
        if (keys["ArrowDown"] || keys["s"] || keys["S"]) player.direction.y = 1;
        if (keys["ArrowLeft"] || keys["a"] || keys["A"])
          player.direction.x = -1;
        if (keys["ArrowRight"] || keys["d"] || keys["D"])
          player.direction.x = 1;

        // Normalize diagonal movement
        const length = Math.sqrt(
          player.direction.x * player.direction.x +
            player.direction.y * player.direction.y
        );

        if (length > 0) {
          player.direction.x /= length;
          player.direction.y /= length;
        }

        // Move player
        player.x += player.direction.x * player.speed;
        player.y += player.direction.y * player.speed;

        // Keep player within bounds
        player.x = Math.max(
          player.radius,
          Math.min(canvas.width - player.radius, player.x)
        );
        player.y = Math.max(
          player.radius,
          Math.min(canvas.height - player.radius, player.y)
        );

        // Update chain weapon
        chainWeapon.update(player.x, player.y);

        // Update effects
        effects.update();

        // Check for chain weapon collisions
        const hitEnemyIndices = chainWeapon.checkCollisions(enemies);

        // Handle enemy hits - remove them from highest index to lowest
        // (to avoid index shifting issues when removing multiple enemies)
        if (hitEnemyIndices.length > 0) {
          // Sort indices in descending order
          hitEnemyIndices.sort((a, b) => b - a);

          // Remove the hit enemies
          for (const index of hitEnemyIndices) {
            const hitEnemy = enemies[index];

            // Create visual effect at hit position
            effects.createHitEffect(hitEnemy.x, hitEnemy.y, hitEnemy.color);

            // Remove the enemy
            enemies.splice(index, 1);

            // Generate a new enemy to replace each destroyed one
            spawnNewEnemy();
          }
        }
      }

      // Render function
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw enemies
        for (const enemy of enemies) {
          ctx.beginPath();
          ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
          ctx.fillStyle = enemy.color;
          ctx.fill();
          ctx.closePath();
        }

        // Draw player
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.closePath();

        // Draw aiming line when weapon is not active
        if (chainWeapon.state === "IDLE") {
          const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
          ctx.beginPath();
          ctx.moveTo(player.x, player.y);
          ctx.lineTo(
            player.x + Math.cos(angle) * 30,
            player.y + Math.sin(angle) * 30
          );
          ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.closePath();
        }

        // Draw chain weapon
        chainWeapon.render(ctx);

        // Draw effects
        effects.render(ctx);
      }

      // Game loop
      function gameLoop() {
        update();
        render();
        requestAnimationFrame(gameLoop);
      }

      // Initialize game
      generateEnemies();
      gameLoop();
    </script>
  </body>
</html>
